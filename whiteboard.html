<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>tldraw 互動白板</title>
  
  <!-- tldraw CSS (tldraw 2.1.4 LTS 黃金穩定版) -->
  <link rel="stylesheet" href="https://esm.sh/tldraw@2.1.4/tldraw.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* 電腦端 (Desktop > 768px)：完全保留 tldraw 100% 原生原始樣式與大小 */

    /* 僅針對行動裝置 (Mobile <= 768px) 進行精細化微調 */
    @media (max-width: 768px) {
      /* 1. 工具列外框：強制以絕對定位懸浮於底部中央，防止被裁切，右側留出 40px 塞入 custom-style-toggle-btn */
      .tlui-toolbar, [class*="tlui-toolbar"], .tl-toolbar {
        position: absolute !important;
        bottom: 12px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        margin: 0 !important;
        padding-top: 3px !important;
        padding-bottom: 3px !important;
        padding-left: 6px !important;
        padding-right: 40px !important;
        box-sizing: border-box !important;
        height: 38px !important;
        min-height: unset !important;
        width: max-content !important;
        z-index: 999 !important;
      }

      /* 2. 按鈕輕量固定尺寸 (32px)，縮小間距，確保 6 個基本按鈕緊湊並排於白框內 */
      .tlui-toolbar button, [class*="tlui-toolbar"] button, .tlui-button {
        height: 32px !important;
        min-height: 32px !important;
        max-height: 32px !important;
        width: 32px !important;
        min-width: 32px !important;
        max-width: 32px !important;
        margin: 0 1px !important;
        padding: 2px !important;
        box-sizing: border-box !important;
        flex-shrink: 0 !important;
      }

      /* 3. 原生浮動圓圈選單按鈕：使用絕對定位物理偏置強行嵌入置中工具列的右側內部 */
      .tlui-style-panel__toggle, [class*="style-panel__toggle"], [class*="style-panel"] button {
        position: absolute !important;
        bottom: 15px !important;
        left: calc(50% + 98px) !important;
        transform: translateX(-50%) !important;
        width: 32px !important;
        height: 32px !important;
        min-width: 32px !important;
        min-height: 32px !important;
        border-radius: 8px !important;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        padding: 2px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        z-index: 1001 !important;
        cursor: pointer !important;
      }

      /* 4. 按鈕 svg 圖示大小適中 */
      .tlui-toolbar svg, [class*="tlui-toolbar"] svg, 
      .tlui-style-panel__toggle svg, [class*="style-panel__toggle"] svg, [class*="style-panel"] button svg {
        width: 16px !important;
        height: 16px !important;
      }
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
      font-size: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0, 122, 255, 0.1);
      border-left-color: #007aff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Import Maps for ES Modules (tldraw 2.1.4 LTS 黃金穩定版 + React 18 鎖定) -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "tldraw": "https://esm.sh/tldraw@2.1.4?deps=react@18.3.1,react-dom@18.3.1"
    }
  }
  </script>
</head>
<body>
  <div id="root">
    <div class="loading-container">
      <div class="spinner"></div>
      <div>正在載入 tldraw 互動白板...</div>
    </div>
  </div>

  <script>
    // 載入超時防禦救援機制
    setTimeout(function() {
      if (!window.editorInstanceRef) {
        var root = document.getElementById('root');
        if (root && root.querySelector('.loading-container')) {
          root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#666;font-size:15px;padding:20px;text-align:center;"><div style="font-size:32px;margin-bottom:12px;">💡</div><div style="font-weight:bold;margin-bottom:8px;">白板正在完成初始化...</div><div style="font-size:13px;color:#888;margin-bottom:16px;">如持續轉圈，請點擊下方按鈕刷新</div><button onclick="window.location.reload()" style="padding:8px 18px;background:#007aff;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;box-shadow:0 2px 8px rgba(0,122,255,0.3);">重新載入白板</button></div>';
        }
      }
    }, 8000);
  </script>

  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { Tldraw } from 'tldraw';

    let editorInstance = null;
    let isApplyingRemote = false;
    let pendingRemoteSnapshot = null;

    window.whiteboardSnapshotDiagnostics = {
      loadedCount: 0,
      recoveredCount: 0,
      rejectedCount: 0,
      droppedRecordCount: 0,
      validationFailures: 0
    };

    // 2.1.4 預設合規 Schema 備援，確保 migrateStoreSnapshot 100% 讀得到相容 schemaVersion
    const DEFAULT_2_1_4_SCHEMA = {
      schemaVersion: 1,
      storeVersion: 4,
      recordVersions: {
        asset: { version: 1, subTypeVersion: 1 },
        camera: { version: 1 },
        document: { version: 2 },
        instance: { version: 22 },
        instance_page_state: { version: 5 },
        page: { version: 1 },
        shape: { version: 3, subTypeVersion: 1 },
        instance_presence: { version: 5 },
        pointer: { version: 1 }
      }
    };

    const ALLOWED_DOCUMENT_RECORD_TYPES = new Set(['document', 'page', 'shape', 'asset']);

    function isPlainObject(val) {
      return Boolean(val) && typeof val === 'object' && !Array.isArray(val);
    }

    function sanitizeRecord(record) {
      if (!isPlainObject(record)) return null;
      if (typeof record.id !== 'string' || !record.id.trim()) return null;
      if (typeof record.typeName !== 'string' || !ALLOWED_DOCUMENT_RECORD_TYPES.has(record.typeName)) {
        return null;
      }
      if (!record.id.startsWith(record.typeName + ':')) {
        return null;
      }

      const cloned = { ...record };
      if (!isPlainObject(cloned.meta)) {
        cloned.meta = {};
      }

      if (cloned.typeName === 'document') {
        if (cloned.id !== 'document:document') return null;
        if (typeof cloned.gridSize !== 'number' || !Number.isFinite(cloned.gridSize)) {
          cloned.gridSize = 10;
        }
        if (typeof cloned.name !== 'string') {
          cloned.name = '';
        }
        return cloned;
      }

      if (cloned.typeName === 'page') {
        if (typeof cloned.name !== 'string' || !cloned.name) {
          cloned.name = 'Page 1';
        }
        if (typeof cloned.index !== 'string' || !cloned.index) {
          cloned.index = 'a1';
        }
        return cloned;
      }

      if (cloned.typeName === 'asset') {
        if (typeof cloned.type !== 'string' || !cloned.type) return null;
        if (!isPlainObject(cloned.props)) return null;
        if (cloned.type === 'image' || cloned.type === 'video') {
          const w = Number(cloned.props.w);
          const h = Number(cloned.props.h);
          if (!Number.isFinite(w) || w <= 0 || !Number.isFinite(h) || h <= 0) {
            return null;
          }
          if (typeof cloned.props.src !== 'string' && cloned.props.src !== null) {
            return null;
          }
        }
        return cloned;
      }

      if (cloned.typeName === 'shape') {
        if (typeof cloned.type !== 'string' || !cloned.type) return null;
        if (typeof cloned.parentId !== 'string' || !cloned.parentId) {
          cloned.parentId = 'page:page';
        }
        if (typeof cloned.index !== 'string' || !cloned.index) {
          cloned.index = 'a1';
        }
        if (!isPlainObject(cloned.props)) return null;

        cloned.x = (typeof cloned.x === 'number' && Number.isFinite(cloned.x)) ? cloned.x : 0;
        cloned.y = (typeof cloned.y === 'number' && Number.isFinite(cloned.y)) ? cloned.y : 0;
        cloned.rotation = (typeof cloned.rotation === 'number' && Number.isFinite(cloned.rotation)) ? cloned.rotation : 0;
        cloned.isLocked = Boolean(cloned.isLocked);
        cloned.opacity = (typeof cloned.opacity === 'number' && Number.isFinite(cloned.opacity) && cloned.opacity >= 0 && cloned.opacity <= 1)
          ? cloned.opacity
          : 1;

        const cleanProps = { ...cloned.props };
        if (cloned.type === 'text' && cleanProps.font === 'draw') {
          cleanProps.font = 'sans';
        }
        if (cloned.type === 'image') {
          const w = Number(cleanProps.w);
          const h = Number(cleanProps.h);
          if (!Number.isFinite(w) || w <= 0 || !Number.isFinite(h) || h <= 0) {
            return null;
          }
        }
        cloned.props = cleanProps;
        return cloned;
      }

      return null;
    }

    function normalizeSchema(rawSchema, fallbackSchema) {
      if (!isPlainObject(rawSchema)) return fallbackSchema;
      if (rawSchema.schemaVersion !== fallbackSchema.schemaVersion) return fallbackSchema;
      if (typeof rawSchema.storeVersion !== 'number' || rawSchema.storeVersion > fallbackSchema.storeVersion || rawSchema.storeVersion < 1) {
        return fallbackSchema;
      }
      if (!isPlainObject(rawSchema.recordVersions)) return fallbackSchema;

      for (const [recType, verObj] of Object.entries(fallbackSchema.recordVersions || {})) {
        const rawVer = rawSchema.recordVersions[recType];
        if (!isPlainObject(rawVer) || typeof rawVer.version !== 'number') {
          return fallbackSchema;
        }
        if (rawVer.version > verObj.version) {
          return fallbackSchema;
        }
      }
      return rawSchema;
    }

    // 快照全自動防禦、轉換與淨化過濾器 (Sanitizer) - 100% 歸一化為 2.1.4 Store-level 快照
    function sanitizeSnapshot(snapshot) {
      let parsed = snapshot;
      if (typeof parsed === 'string') {
        try {
          parsed = JSON.parse(parsed);
        } catch (e) {
          window.whiteboardSnapshotDiagnostics.rejectedCount += 1;
          return null;
        }
      }
      if (!isPlainObject(parsed)) {
        window.whiteboardSnapshotDiagnostics.rejectedCount += 1;
        return null;
      }

      let rawStore = null;
      let rawSchema = null;

      // 情況 A：原生 2.1.4 Store-level 結構 { store: {...}, schema: {...} }
      if (isPlainObject(parsed.store)) {
        rawStore = parsed.store;
        rawSchema = parsed.schema;
      } 
      // 情況 B：舊雙層包裝結構 { document: { store: {...}, schema: {...} } }
      else if (isPlainObject(parsed.document) && isPlainObject(parsed.document.store)) {
        rawStore = parsed.document.store;
        rawSchema = parsed.document.schema || parsed.schema;
      }

      if (!isPlainObject(rawStore)) {
        window.whiteboardSnapshotDiagnostics.rejectedCount += 1;
        return null;
      }

      // 嚴格淨化過濾 Store 裡面的各個 record
      const cleanStore = {};
      for (const key in rawStore) {
        if (!Object.prototype.hasOwnProperty.call(rawStore, key)) continue;
        const candidate = rawStore[key];
        if (isPlainObject(candidate) && typeof candidate.typeName === 'string' && !ALLOWED_DOCUMENT_RECORD_TYPES.has(candidate.typeName)) {
          continue;
        }
        const sanitized = sanitizeRecord(candidate);
        if (sanitized) {
          cleanStore[sanitized.id] = sanitized;
        } else {
          window.whiteboardSnapshotDiagnostics.droppedRecordCount += 1;
          console.warn('[Snapshot Sanitizer] Skipped invalid record:', key, candidate);
        }
      }

      const fallbackSchema = (editorInstance && editorInstance.store && editorInstance.store.schema) 
        ? editorInstance.store.schema.serialize() 
        : DEFAULT_2_1_4_SCHEMA;

      return {
        store: cleanStore,
        schema: normalizeSchema(rawSchema, fallbackSchema)
      };
    }

    window.sanitizeWhiteboardSnapshot = sanitizeSnapshot;

    function applySnapshotSafely(rawSnapshot) {
      if (!editorInstance || !editorInstance.store) {
        pendingRemoteSnapshot = rawSnapshot;
        return false;
      }

      const cleanSnapshot = sanitizeSnapshot(rawSnapshot);
      if (!cleanSnapshot || !isPlainObject(cleanSnapshot.store)) {
        console.warn('[Snapshot Guard] Rejected invalid or empty snapshot');
        return false;
      }

      const fallbackSchema = (editorInstance.store.schema && typeof editorInstance.store.schema.serialize === 'function')
        ? editorInstance.store.schema.serialize()
        : DEFAULT_2_1_4_SCHEMA;

      try {
        if (typeof editorInstance.store.loadSnapshot === 'function') {
          editorInstance.store.loadSnapshot(cleanSnapshot);
        } else if (typeof editorInstance.loadSnapshot === 'function') {
          editorInstance.loadSnapshot(cleanSnapshot);
        }
        window.whiteboardSnapshotDiagnostics.loadedCount += 1;
        return true;
      } catch (stage1Err) {
        console.warn('[Snapshot Guard] Stage 1 loadSnapshot failed, retrying with runtime schema:', stage1Err);
      }

      try {
        const runtimeSnapshot = {
          store: cleanSnapshot.store,
          schema: fallbackSchema
        };
        if (typeof editorInstance.store.loadSnapshot === 'function') {
          editorInstance.store.loadSnapshot(runtimeSnapshot);
        } else if (typeof editorInstance.loadSnapshot === 'function') {
          editorInstance.loadSnapshot(runtimeSnapshot);
        }
        window.whiteboardSnapshotDiagnostics.recoveredCount += 1;
        return true;
      } catch (stage2Err) {
        console.warn('[Snapshot Guard] Stage 2 loadSnapshot failed, falling back to per-record isolation:', stage2Err);
      }

      try {
        const records = Object.values(cleanSnapshot.store);
        const order = { document: 1, page: 2, asset: 3, shape: 4 };
        records.sort((a, b) => (order[a.typeName] || 99) - (order[b.typeName] || 99));

        const applyRecords = () => {
          const existingShapes = typeof editorInstance.getCurrentPageShapeIds === 'function'
            ? Array.from(editorInstance.getCurrentPageShapeIds())
            : [];
          const incomingIds = new Set(records.map((r) => r.id));
          const toRemove = existingShapes.filter((id) => !incomingIds.has(id));
          if (toRemove.length > 0 && typeof editorInstance.store.remove === 'function') {
            try { editorInstance.store.remove(toRemove); } catch (_) {}
          }
          for (const rec of records) {
            try {
              editorInstance.store.put([rec]);
            } catch (recErr) {
              window.whiteboardSnapshotDiagnostics.droppedRecordCount += 1;
              console.warn('[Snapshot Guard] Isolated & skipped corrupted record:', rec.id, recErr);
            }
          }
        };

        if (typeof editorInstance.store.mergeRemoteChanges === 'function') {
          editorInstance.store.mergeRemoteChanges(applyRecords);
        } else {
          applyRecords();
        }
        window.whiteboardSnapshotDiagnostics.recoveredCount += 1;
        return true;
      } catch (stage3Err) {
        window.whiteboardSnapshotDiagnostics.rejectedCount += 1;
        console.error('[Snapshot Guard] All 3 stages failed to apply snapshot:', stage3Err);
        return false;
      }
    }

    function App() {
      const [canUndo, setCanUndo] = React.useState(false);
      const [canRedo, setCanRedo] = React.useState(false);

      const handleMount = (editor) => {
        editorInstance = editor;
        window.editorInstanceRef = editor;
        console.log('tldraw initialized successfully!');
        
        // 初始狀態
        setCanUndo(editor.getCanUndo());
        setCanRedo(editor.getCanRedo());

        // 核心 Safe Validation Failure 放行器（避免 redaction 爆破）
        try {
          if (editor.store && editor.store.schema) {
            editor.store.schema.onValidationFailure = ({ error, phase, record, recordBefore }) => {
              window.whiteboardSnapshotDiagnostics.validationFailures += 1;
              console.warn('[tldraw Validation Safeguarded]:', {
                error: error ? (error.message || error) : 'unknown',
                phase,
                recordId: record ? record.id : undefined,
                recordTypeName: record ? record.typeName : undefined,
                recordBeforeTypeName: recordBefore ? recordBefore.typeName : undefined
              });
              const repaired = sanitizeRecord(record) || sanitizeRecord(recordBefore);
              if (repaired) return repaired;
              if (record && typeof record === 'object') return record;
              if (recordBefore && typeof recordBefore === 'object') return recordBefore;
              return { id: 'document:document', typeName: 'document', gridSize: 10, name: '', meta: {} };
            };
          }
        } catch (e) {
          console.warn('Failed to attach safe onValidationFailure:', e);
        }

        // 註冊 tldraw 內建正宗 ExternalContentHandler (貼上與拖放檔案)
        try {
          if (typeof editor.registerExternalContentHandler === 'function') {
            editor.registerExternalContentHandler('files', async ({ files, point }) => {
              for (const file of files) {
                if (file.type && file.type.startsWith('image/')) {
                  const reader = new FileReader();
                  reader.onload = async (e) => {
                    const dataUrl = e.target.result;
                    if (!dataUrl) return;
                    const img = new Image();
                    img.onload = async () => {
                      const w = img.width || 400;
                      const h = img.height || 300;
                      const assetId = `asset:${Math.random().toString(36).substring(2, 11)}`;
                      const shapeId = `shape:${Math.random().toString(36).substring(2, 11)}`;
                      const p = point || (editor.getViewportPageBounds ? editor.getViewportPageBounds().center : { x: 200, y: 200 });

                      if (typeof editor.createAssets === 'function' && typeof editor.createShapes === 'function') {
                        await editor.createAssets([{
                          id: assetId,
                          typeName: 'asset',
                          type: 'image',
                          props: {
                            name: file.name || 'clipboard-image.png',
                            src: dataUrl,
                            w: w,
                            h: h,
                            mimeType: file.type || 'image/png',
                            isAnimated: false
                          },
                          meta: {}
                        }]);

                        await editor.createShapes([{
                          id: shapeId,
                          type: 'image',
                          x: p.x - w / 2,
                          y: p.y - h / 2,
                          props: {
                            w: w,
                            h: h,
                            assetId: assetId
                          }
                        }]);

                        if (typeof editor.setSelectedShapes === 'function') {
                          editor.setSelectedShapes([shapeId]);
                        }
                      }
                    };
                    img.src = dataUrl;
                  };
                  reader.readAsDataURL(file);
                }
              }
            });
          }
        } catch (err) {
          console.warn('registerExternalContentHandler registration warning:', err);
        }

        // 核心剪貼簿圖片貼上全自動接管 (Base64 Data URL Clipboard Guard)
        const handleImagePaste = async (clipboardEvent) => {
          try {
            const clipboardData = clipboardEvent.clipboardData || window.clipboardData;
            if (!clipboardData) return;

            let imageFile = null;
            if (clipboardData.files && clipboardData.files.length > 0) {
              for (let i = 0; i < clipboardData.files.length; i++) {
                if (clipboardData.files[i].type && clipboardData.files[i].type.startsWith('image/')) {
                  imageFile = clipboardData.files[i];
                  break;
                }
              }
            }
            if (!imageFile && clipboardData.items) {
              for (let i = 0; i < clipboardData.items.length; i++) {
                const item = clipboardData.items[i];
                if (item.type && item.type.startsWith('image/')) {
                  imageFile = item.getAsFile();
                  break;
                }
              }
            }

            if (imageFile) {
              clipboardEvent.preventDefault();
              clipboardEvent.stopPropagation();

              if (!editorInstance) return;

              const reader = new FileReader();
              reader.onload = async (evt) => {
                const dataUrl = evt.target.result;
                if (!dataUrl) return;

                const img = new Image();
                img.onload = async () => {
                  try {
                    const width = img.width || 400;
                    const height = img.height || 300;
                    const assetId = `asset:${Math.random().toString(36).substring(2, 11)}`;
                    const shapeId = `shape:${Math.random().toString(36).substring(2, 11)}`;

                    const viewportBounds = typeof editorInstance.getViewportPageBounds === 'function' ? editorInstance.getViewportPageBounds() : null;
                    const centerPoint = viewportBounds ? viewportBounds.center : { x: 200, y: 200 };

                    if (typeof editorInstance.createAssets === 'function' && typeof editorInstance.createShapes === 'function') {
                      await editorInstance.createAssets([{
                        id: assetId,
                        typeName: 'asset',
                        type: 'image',
                        props: {
                          name: imageFile.name || 'clipboard-image.png',
                          src: dataUrl,
                          w: width,
                          h: height,
                          mimeType: imageFile.type || 'image/png',
                          isAnimated: false
                        },
                        meta: {}
                      }]);

                      await editorInstance.createShapes([{
                        id: shapeId,
                        type: 'image',
                        x: centerPoint.x - width / 2,
                        y: centerPoint.y - height / 2,
                        props: {
                          w: width,
                          h: height,
                          assetId: assetId
                        }
                      }]);

                      if (typeof editorInstance.setSelectedShapes === 'function') {
                        editorInstance.setSelectedShapes([shapeId]);
                      }
                    }
                  } catch (err) {
                    console.error('Pasted image injection failed:', err);
                  }
                };
                img.src = dataUrl;
              };
              reader.readAsDataURL(imageFile);
            }
          } catch (err) {
            console.warn('Paste event handler warning:', err);
          }
        };

        window.addEventListener('paste', handleImagePaste, true);

        // 監聽使用者在白板上的畫筆/文字/圖片/物件變動 (scope: 'document')
        let debounceTimer = null;
        editor.store.listen((entry) => {
          // 動態同步 Undo/Redo 狀態
          setCanUndo(editor.getCanUndo());
          setCanRedo(editor.getCanRedo());

          if (!isApplyingRemote) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
              try {
                const rawSnapshot = editor.store ? editor.store.getSnapshot() : null;
                const snapshot = rawSnapshot ? (sanitizeSnapshot(rawSnapshot) || rawSnapshot) : null;
                if (snapshot && window.parent && window.parent !== window) {
                  window.parent.postMessage({
                    type: 'TLDRAW_LOCAL_CHANGE',
                    snapshot: snapshot
                  }, '*');
                }
              } catch (err) {
                console.error('Failed to capture local tldraw change:', err);
              }
            }, 300);
          }
        }, { scope: 'document' });

        if (pendingRemoteSnapshot) {
          const queuedSnapshot = pendingRemoteSnapshot;
          pendingRemoteSnapshot = null;
          try {
            isApplyingRemote = true;
            applySnapshotSafely(queuedSnapshot);
          } finally {
            setTimeout(() => { isApplyingRemote = false; }, 300);
          }
        }

        // 通知父視窗已準備就緒
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'TLDRAW_READY' }, '*');
        }
      };

      // 使用穩定且不因時序誤判的 userAgent 偵測，徹底將行動端與電腦端隔離，還原電腦端右側樣式面板
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      // 核心 UI 組件配置：傳入 Toast: () => null 徹底拔除並禁用引發 react-toast.mjs 崩潰之原廠 ToastProvider
      const tldrawComponents = {
        Toast: () => null,
        ...(isMobile ? {
          MainMenu: null,
          PageMenu: null,
          NavigationPanel: null,
          HelpMenu: null,
          QuickActions: null // 隱藏底部原廠 Undo/Redo，防止遮擋重疊
        } : {})
      };

      // 手機版在頂部右上角渲染一個精緻、小巧、半透明的復原/重做按鈕組
      const customControls = isMobile ? React.createElement('div', {
        style: {
          position: 'absolute',
          top: '8px',
          right: '8px',
          zIndex: 1000,
          display: 'flex',
          gap: '6px',
          alignItems: 'center',
          pointerEvents: 'auto'
        }
      }, [
        React.createElement('button', {
          key: 'undo',
          onClick: () => { if (editorInstance) editorInstance.undo(); },
          disabled: !canUndo,
          style: {
            padding: '6px 10px',
            fontSize: '13px',
            background: 'rgba(255, 255, 255, 0.9)',
            border: '1px solid rgba(0,0,0,0.15)',
            borderRadius: '8px',
            boxShadow: '0 2px 8px rgba(0,0,0,0.1)',
            cursor: 'pointer',
            opacity: canUndo ? 1 : 0.4,
            pointerEvents: canUndo ? 'auto' : 'none',
            display: 'flex',
            alignItems: 'center',
            gap: '4px',
            fontWeight: 'bold',
            color: '#333'
          }
        }, '↩️ 復原'),
        React.createElement('button', {
          key: 'redo',
          onClick: () => { if (editorInstance) editorInstance.redo(); },
          disabled: !canRedo,
          style: {
            padding: '6px 10px',
            fontSize: '13px',
            background: 'rgba(255, 255, 255, 0.9)',
            border: '1px solid rgba(0,0,0,0.15)',
            borderRadius: '8px',
            boxShadow: '0 2px 8px rgba(0,0,0,0.1)',
            cursor: 'pointer',
            opacity: canRedo ? 1 : 0.4,
            pointerEvents: canRedo ? 'auto' : 'none',
            display: 'flex',
            alignItems: 'center',
            gap: '4px',
            fontWeight: 'bold',
            color: '#333'
          }
        }, '↪️ 重做'),
        React.createElement('span', {
          key: 'ver',
          style: {
            fontSize: '9px',
            color: '#999',
            background: 'rgba(255,255,255,0.7)',
            padding: '2px 4px',
            borderRadius: '4px',
            border: '1px solid rgba(0,0,0,0.1)',
            fontWeight: 'bold',
            userSelect: 'none'
          }
        }, 'v1.4.6')
      ]) : null;

      const tldrawProps = {
        key: 'tldraw',
        onMount: handleMount,
        components: tldrawComponents,
        forceMobile: isMobile // 強制在行動端使用原生折疊式的 Mobile UI，以提供帶有 ^ 箭頭的樣式與面板按鈕
      };

      return React.createElement(React.Fragment, null, [
        React.createElement(Tldraw, tldrawProps),
        customControls
      ]);
    }

    // 監聽來自父視窗的 postMessage 通訊
    window.addEventListener('message', async (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      switch (data.type) {
        case 'GET_TLDRAW_SNAPSHOT':
          if (editorInstance && editorInstance.store) {
            try {
              const rawSnapshot = typeof editorInstance.store.getSnapshot === 'function' 
                ? editorInstance.store.getSnapshot() 
                : (editorInstance.getSnapshot ? editorInstance.getSnapshot() : null);
              const snapshot = rawSnapshot ? (sanitizeSnapshot(rawSnapshot) || rawSnapshot) : null;
              window.parent.postMessage({
                type: 'TLDRAW_SNAPSHOT_RESPONSE',
                requestId: data.requestId,
                snapshot: snapshot
              }, '*');
            } catch (err) {
              console.error('Failed to get tldraw snapshot:', err);
              window.parent.postMessage({
                type: 'TLDRAW_SNAPSHOT_RESPONSE',
                requestId: data.requestId,
                error: err.message
              }, '*');
            }
          }
          break;

        case 'LOAD_TLDRAW_SNAPSHOT':
          if (!data.snapshot) break;
          if (!editorInstance || !editorInstance.store) {
            pendingRemoteSnapshot = data.snapshot;
            break;
          }
          try {
            isApplyingRemote = true;
            const loaded = applySnapshotSafely(data.snapshot);
            if (loaded) {
              console.log('tldraw remote snapshot sanitized and loaded successfully');
            } else {
              console.warn('Received invalid snapshot format, skipped loading to prevent crash');
            }
          } catch (err) {
            console.error('Failed to load tldraw snapshot safely:', err);
          } finally {
            setTimeout(() => { isApplyingRemote = false; }, 300);
          }
          break;

        case 'CLEAR_TLDRAW':
          if (editorInstance) {
            try {
              editorInstance.selectAll();
              const selectedIds = editorInstance.getSelectedShapeIds();
              if (selectedIds && selectedIds.length > 0) {
                editorInstance.deleteShapes(selectedIds);
              }
            } catch (err) {
              console.error('Failed to clear tldraw:', err);
            }
          }
          break;
      }
    });

    // 渲染頁面
    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);
    root.render(React.createElement(App));

  </script>
</body>
</html>
