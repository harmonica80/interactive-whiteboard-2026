<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGradActive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-5" width="280" height="220" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 標題列 -->
  <text x="32" y="38" fill="#38bdf8" font-size="14" font-weight="bold" letter-spacing="1">TEACHER AUTHENTICATION &amp; SECURITY GUIDE</text>
  <text x="32" y="64" fill="#ffffff" font-size="20" font-weight="bold">教師專屬密碼與自救安全設定流程</text>
  <rect x="710" y="24" width="98" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="759" y="41" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">SHA-256 防護</text>

  <!-- 卡片 1：首次登入 -->
  <g transform="translate(32, 85)" filter="url(#cardShadow)">
    <rect width="240" height="150" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="#0284c7" />
    <text x="36" y="42" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">1</text>
    <text x="66" y="34" fill="#94a3b8" font-size="12" font-weight="600">首次進入</text>
    <text x="66" y="52" fill="#f8fafc" font-size="15" font-weight="bold">點選 ⚙️ 管理後台</text>
    
    <line x1="20" y1="72" x2="220" y2="72" stroke="#334155" stroke-width="1" />
    
    <text x="20" y="94" fill="#cbd5e1" font-size="12.5" font-weight="500">• 點選右上角齒輪進入管理頁</text>
    <text x="20" y="116" fill="#cbd5e1" font-size="12.5" font-weight="500">• 初始預設密碼 1234 (7天寬限)</text>
    <text x="20" y="138" fill="#f59e0b" font-size="11.5" font-weight="600">⚠️ 超過一週須自訂專屬密碼</text>
  </g>

  <!-- 箭頭 1 -->
  <g transform="translate(282, 150)">
    <path d="M0,0 L20,0 M14,-6 L20,0 L14,6" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- 卡片 2：設定專屬密碼 -->
  <g transform="translate(312, 85)" filter="url(#cardShadow)">
    <rect width="245" height="150" rx="12" fill="url(#cardGradActive)" stroke="#6366f1" stroke-width="2" />
    <circle cx="36" cy="36" r="18" fill="#4f46e5" />
    <text x="36" y="42" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">2</text>
    <text x="66" y="34" fill="#a5b4fc" font-size="12" font-weight="600">安全關鍵步驟</text>
    <text x="66" y="52" fill="#ffffff" font-size="15" font-weight="bold">前往 F 項目設定密碼</text>
    
    <line x1="20" y1="72" x2="225" y2="72" stroke="#4338ca" stroke-width="1" />
    
    <text x="20" y="94" fill="#e0e7ff" font-size="12.5" font-weight="500">• 進入「F. 教師身分與密碼安全」</text>
    <text x="20" y="116" fill="#e0e7ff" font-size="12.5" font-weight="500">• 自訂專屬密碼（舊密碼即失效）</text>
    <text x="20" y="138" fill="#34d399" font-size="11.5" font-weight="bold">🔒 綁定安全提問，遺忘免驚！</text>
  </g>

  <!-- 箭頭 2 -->
  <g transform="translate(567, 150)">
    <path d="M0,0 L20,0 M14,-6 L20,0 L14,6" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- 卡片 3：全班級通用與自救 -->
  <g transform="translate(597, 85)" filter="url(#cardShadow)">
    <rect width="210" height="150" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="#059669" />
    <text x="36" y="42" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">3</text>
    <text x="66" y="34" fill="#94a3b8" font-size="12" font-weight="600">管理更輕鬆</text>
    <text x="66" y="52" fill="#f8fafc" font-size="15" font-weight="bold">一組密碼全班通用</text>
    
    <line x1="20" y1="72" x2="190" y2="72" stroke="#334155" stroke-width="1" />
    
    <text x="20" y="94" fill="#cbd5e1" font-size="12.5" font-weight="500">• 名下多班白板自動通用</text>
    <text x="20" y="116" fill="#cbd5e1" font-size="12.5" font-weight="500">• 忘記時點「❓ 忘記密碼？」</text>
    <text x="20" y="138" fill="#38bdf8" font-size="11.5" font-weight="bold">⚡ 回答安全題目線上秒自救</text>
  </g>
</svg>
