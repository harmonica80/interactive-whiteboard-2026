<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="resetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff453a" />
      <stop offset="100%" stop-color="#d32f2f" />
    </linearGradient>
    <filter id="resetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d32f2f" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- 背景圓角方塊 -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#resetBg)" filter="url(#resetShadow)" />
  
  <!-- 內層淺色圓形卡片 -->
  <circle cx="64" cy="64" r="42" fill="#ffffff" fill-opacity="0.16" />
  
  <!-- 旋轉復原箭頭 (Reset Circle Arrow) -->
  <path d="M 64 34 A 30 30 0 1 1 37.5 49.5" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
  <!-- 箭頭頂端三角 (Arrow Head) -->
  <polygon points="34,34 50,44 36,54" fill="#ffffff" />
  
  <!-- 中央資料重設核心標記 (Database / Sparkle / Shield) -->
  <rect x="52" y="55" width="24" height="6" rx="3" fill="#ffffff" />
  <rect x="52" y="65" width="24" height="6" rx="3" fill="#ffffff" />
  <circle cx="64" cy="79" r="3.5" fill="#ffffff" />
</svg>
