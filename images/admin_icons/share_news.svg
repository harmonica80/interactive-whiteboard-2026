      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="shadow11" x="0" y="4" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#BE123C" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad11)" filter="url(#shadow11)" />
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  
