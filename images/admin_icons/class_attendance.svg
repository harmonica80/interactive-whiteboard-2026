<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="attBgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="attShadow" x="0" y="4" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#attBgGrad)" filter="url(#attShadow)" />
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="28" cy="28" r="16" fill="#FFFFFF" fill-opacity="0.2" />

  <!-- 點名板與核取筆記 -->
  <g transform="translate(24, 20)">
    <!-- 剪貼板主體 -->
    <rect x="6" y="14" width="68" height="78" rx="10" fill="#FFFFFF" />
    <!-- 夾子頂部 -->
    <rect x="25" y="6" width="30" height="14" rx="4" fill="#E2E8F0" stroke="#64748B" stroke-width="2" />
    <rect x="33" y="2" width="14" height="8" rx="2" fill="#94A3B8" />

    <!-- 條目與打勾 -->
    <!-- 行 1: 打勾 -->
    <circle cx="22" cy="34" r="6" fill="#D1FAE5" />
    <path d="M19 34 L21 37 L26 31" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="34" y="32" width="30" height="5" rx="2.5" fill="#CBD5E1" />

    <!-- 行 2: 打勾 -->
    <circle cx="22" cy="50" r="6" fill="#D1FAE5" />
    <path d="M19 50 L21 53 L26 47" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="34" y="48" width="24" height="5" rx="2.5" fill="#CBD5E1" />

    <!-- 行 3: 遲到/點 -->
    <circle cx="22" cy="66" r="6" fill="#FEF3C7" />
    <circle cx="22" cy="66" r="2.5" fill="#D97706" />
    <rect x="34" y="64" width="28" height="5" rx="2.5" fill="#CBD5E1" />
  </g>
</svg>
