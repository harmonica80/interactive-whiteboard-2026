<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad9" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="shadow9" x="0" y="4" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#EA580C" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad9)" filter="url(#shadow9)" />
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  
  <g transform="translate(20, 20)">
    <!-- 後層相片 (傾斜) -->
    <g transform="translate(10, 4) rotate(8)">
      <rect x="0" y="0" width="70" height="74" rx="8" fill="#FFE8D6" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
    
    <!-- 前層拍立得相框 -->
    <rect x="6" y="8" width="76" height="80" rx="10" fill="#FFFFFF" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.15))" />
    
    <!-- 照片內部景象 (藍天、太陽、山脈) -->
    <rect x="12" y="14" width="64" height="54" rx="6" fill="#67E8F9" />
    <!-- 暖陽 -->
    <circle cx="26" cy="28" r="8" fill="#FACC15" />
    <!-- 後山 -->
    <polygon points="28,42 46,26 64,48 76,68 12,68" fill="#38BDF8" fill-opacity="0.6" />
    <!-- 前山翠綠 -->
    <polygon points="12,68 32,46 48,58 60,42 76,68" fill="#10B981" />
    
    <!-- 標籤迴紋針/星星收藏徽章 -->
    <g transform="translate(56, 56)">
      <circle cx="16" cy="16" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
      <path d="M16 8L18.5 13L24 13.8L20 17.7L21 23.2L16 20.6L11 23.2L12 17.7L8 13.8L13.5 13L16 8Z" fill="#FFFFFF" />
