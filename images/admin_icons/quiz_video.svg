<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5856D6" />
      <stop offset="100%" stop-color="#E040FB" />
    </linearGradient>
    <filter id="shadow5" x="0" y="4" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5856D6" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad5)" filter="url(#shadow5)" />
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  
  <g transform="translate(20, 18)">
    <!-- 電影拍板 (場記板) -->
    <!-- 頂部斑馬紋條桿 (張開狀態) -->
    <g transform="translate(6, 6) rotate(-12)">
      <rect x="0" y="0" width="76" height="16" rx="4" fill="#2C2C2E" stroke="#FFFFFF" stroke-width="1.5" />
      <path d="M12 0L4 16H16L24 0H12ZM36 0L28 16H40L48 0H36ZM60 0L52 16H64L72 0H60Z" fill="#FFFFFF" />
    </g>
    
    <!-- 拍板下主體 (播放螢幕) -->
    <rect x="8" y="24" width="74" height="60" rx="8" fill="#1C1C1E" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- 螢幕內畫面與播放按鈕 -->
    <circle cx="45" cy="50" r="14" fill="#FFFFFF" fill-opacity="0.2" />
    <polygon points="41,43 53,50 41,57" fill="#FFFFFF" />
    
    <!-- 時間軸進度條與出題黃點標記 -->
    <rect x="16" y="70" width="58" height="4" rx="2" fill="#48484A" />
    <rect x="16" y="70" width="28" height="4" rx="2" fill="#E040FB" />
    <!-- 出題時間點 (紅色/黃色亮點) -->
    <circle cx="44" cy="72" r="4" fill="#FFCC00" stroke="#FFFFFF" stroke-width="1.5" />
    
    <!-- 出題測驗問號小氣泡 (右上角) -->
