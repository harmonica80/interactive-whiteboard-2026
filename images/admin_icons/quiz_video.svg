      <circle cx="16" cy="16" r="14" fill="#FF2D55" stroke="#FFFFFF" stroke-width="2" />
      <text x="12" y="22" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">?</text>
    </g>
  </g>
