<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C7BE" />
      <stop offset="100%" stop-color="#007AFF" />
    </linearGradient>
    <filter id="shadow3" x="0" y="4" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#007AFF" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad3)" filter="url(#shadow3)" />
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  <circle cx="30" cy="100" r="18" fill="#FFFFFF" fill-opacity="0.1" />
  
  <!-- 雙資料夾與同步箭頭 -->
  <g transform="translate(20, 20)">
    <!-- 後層資料夾 (來源班級) -->
    <rect x="6" y="10" width="28" height="12" rx="4" fill="#E0F7FA" />
    <rect x="6" y="18" width="56" height="42" rx="8" fill="#E0F7FA" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="14" y="42" font-family="sans-serif" font-size="12" font-weight="bold" fill="#007AFF">301班</text>
    
    <!-- 前層資料夾 (目的班級) -->
    <rect x="30" y="32" width="28" height="12" rx="4" fill="#FFFFFF" />
    <rect x="30" y="40" width="56" height="42" rx="8" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))" />
    <text x="38" y="64" font-family="sans-serif" font-size="12" font-weight="bold" fill="#00C7BE">302班</text>
    
    <!-- 一鍵同步雙向環繞箭頭 -->
    <g transform="translate(44, 22)">
      <circle cx="20" cy="20" r="18" fill="#FFCC00" stroke="#FFFFFF" stroke-width="2.5" />
      <!-- 旋轉箭頭 1 -->
      <path d="M12 20C12 15.58 15.58 12 20 12C22.5 12 24.7 13.1 26.2 15" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round" />
      <path d="M26 11V16H21" fill="none" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- 旋轉箭頭 2 -->
      <path d="M28 20C28 24.42 24.42 28 20 28C17.5 28 15.3 26.9 13.8 25" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round" />
      <path d="M14 29V24H19" fill="none" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
