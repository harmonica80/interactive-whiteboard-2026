<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad12" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow12" x="0" y="4" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#D97706" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad12)" filter="url(#shadow12)" />
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- 疊放教材書籍、書籤與學士帽 -->
  <g transform="translate(18, 18)">
    <!-- 底層大教材書本 (綠色) -->
    <rect x="10" y="58" width="72" height="18" rx="4" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M10 64H82" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M82 60L80 74H84L82 60Z" fill="#FCD34D" />
    
    <!-- 中層教材書本 (藍色) -->
    <rect x="14" y="40" width="66" height="18" rx="4" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M14 46H80" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- 書籤紅緞帶垂下 -->
    <path d="M68 40V56L72 52L76 56V40H68Z" fill="#EF4444" />
    
    <!-- 頂層教材書本 (金色/開卷書頁) -->
    <rect x="18" y="22" width="60" height="18" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))" />
    <rect x="24" y="27" width="24" height="4" rx="2" fill="#F59E0B" />
    <rect x="24" y="33" width="36" height="3" rx="1.5" fill="#E5E7EB" />
    
    <!-- 學士帽 (右上角象徵課程進度與學識) -->
    <g transform="translate(48, 4)">
      <!-- 帽頂菱形 -->
      <polygon points="20,8 38,15 20,22 2,15" fill="#1F2937" stroke="#FFFFFF" stroke-width="1.5" />
      <!-- 帽身圓弧 -->
      <path d="M10 18V26C10 30 30 30 30 26V18" fill="#374151" stroke="#FFFFFF" stroke-width="1" />
      <!-- 流蘇金線 -->
      <path d="M20 15L34 26V32" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" fill="none" />
      <circle cx="34" cy="33" r="2.5" fill="#F59E0B" />
    </g>
  </g>
</svg>
