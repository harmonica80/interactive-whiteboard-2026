<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>
    <filter id="shadow4" x="0" y="4" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5856D6" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad4)" filter="url(#shadow4)" />
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="25.25" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- 試卷與選擇題選項 -->
  <g transform="translate(24, 18)">
    <!-- 試卷紙張 -->
    <rect x="4" y="6" width="72" height="84" rx="8" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.15))" />
    
    <!-- 試卷頁首橫條 -->
    <rect x="14" y="16" width="36" height="5" rx="2.5" fill="#007AFF" />
    <rect x="14" y="25" width="52" height="3" rx="1.5" fill="#E5E5EA" />
    
    <!-- 選項 A (未選) -->
    <circle cx="20" cy="38" r="5" stroke="#8E8E93" stroke-width="1.5" fill="#F2F2F7" />
    <text x="18" y="41" font-family="sans-serif" font-size="8" font-weight="bold" fill="#8E8E93">A</text>
    <rect x="30" y="36" width="34" height="4" rx="2" fill="#D1D1D6" />
    
    <!-- 選項 B (正解勾選) -->
    <circle cx="20" cy="52" r="6" fill="#34C759" />
    <path d="M17 52L19 54.5L23.5 49.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="30" y="50" width="38" height="4" rx="2" fill="#34C759" />
    
    <!-- 選項 C (未選) -->
    <circle cx="20" cy="66" r="5" stroke="#8E8E93" stroke-width="1.5" fill="#F2F2F7" />
    <text x="18" y="69" font-family="sans-serif" font-size="8" font-weight="bold" fill="#8E8E93">C</text>
    <rect x="30" y="64" width="30" height="4" rx="2" fill="#D1D1D6" />
    
    <!-- 立體鉛筆 -->
    <g transform="translate(56, 42) rotate(35)">
      <rect x="0" y="0" width="12" height="40" rx="3" fill="#FFCC00" stroke="#FFFFFF" stroke-width="1.5" />
      <path d="M0 40L6 48L12 40H0Z" fill="#FFA000" />
      <path d="M4 45L6 48L8 45H4Z" fill="#333333" />
      <rect x="0" y="0" width="12" height="8" rx="2" fill="#FF2D55" />
    </g>
  </g>
</svg>
